# HTTP -> HTTPS 리다이렉트
server {
  listen 80;
  server_name poppop.site;
  return 301 https://$host$request_uri;
}

# HTTPS + SSL + Static + API + OAuth + Login
server {
  listen 443 ssl;
  server_name poppop.site;

  ssl_certificate     /etc/letsencrypt/live/poppop.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/poppop.site/privkey.pem;

  location = /swagger-ui.html {
    proxy_pass         http://ita-backend:8080/swagger-ui.html;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  }
  location /swagger-ui/ {
    proxy_pass         http://ita-backend:8080/swagger-ui/;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  }
  location /v3/api-docs/ {
    proxy_pass         http://ita-backend:8080/v3/api-docs/;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  # 정적 파일 (React)
  # location / {
    # root   /home/ubuntu/frontend/dist;
    # try_files $uri /index.html;
  # }

  # API 프록시
  location /api/ {
    proxy_pass         http://ita-backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header   Connection        keep-alive;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  # OAuth 콜백
  location /oauth2/ {
    proxy_pass         http://ita-backend:8080/oauth2/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  # 로그인 콜백
  location /login/ {
    proxy_pass         http://ita-backend:8080/login/;
  }
}
