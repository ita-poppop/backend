name: Backend CI/CD

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

# 레지스트리 태그를 한 곳에 모아두기
env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/ita-backend:latest

jobs:
  # ───────────────────────── CI (PR용 빌드·테스트) ─────────────────────────
  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run tests
        run: ./gradlew test

  # ───────────────────────── CD (develop 브랜치 푸시 시) ─────────────────────────
  cd:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      # 1) 소스 체크아웃 + JAR 빌드
      - uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      # 2) 도커 이미지 빌드 → Docker Hub 푸시
      - name: Build Docker image
        run: docker build -t $IMAGE_NAME .

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Push Docker image
        run: docker push $IMAGE_NAME

      # 3) docker-compose.yml, nginx EC2로 복사
      - name: Copy compose & nginx config to EC2
        uses: appleboy/scp-action@v0.1.7

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "compose.yml,nginx/poppop.conf"
          target: "~/poppop"

      # 4) EC2로 배포 (compose pull/up)
      - name: Deploy to EC2 with Compose
        uses: appleboy/ssh-action@v0.1.7
        env:                           # ← 추가
          MYSQLDB_USERNAME: ${{ secrets.MYSQLDB_USERNAME }}
          MYSQLDB_PASSWORD: ${{ secrets.MYSQLDB_PASSWORD }}
          MYSQLDB_ROOT_PASSWORD: ${{ secrets.MYSQLDB_ROOT_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GEOCODING_ID: ${{ secrets.GEOCODING_ID }}
          GEOCODING_SECRET: ${{ secrets.GEOCODING_SECRET }}
          AWS_S3_ACCESS_KEY: ${{ secrets.AWS_S3_ACCESS_KEY }}
          AWS_S3_SECRET_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          # compose.yml 안에서 ${MYSQLDB_*}, ${DOCKERHUB_USERNAME} 변수를 쓰므로 전달
          envs: MYSQLDB_USERNAME,MYSQLDB_PASSWORD,MYSQLDB_ROOT_PASSWORD,DOCKERHUB_USERNAME,GEOCODING_ID,GEOCODING_SECRET,AWS_S3_ACCESS_KEY,AWS_S3_SECRET_KEY

          script: |
            set -e
            cd ~/poppop

            # 기존 단일 컨테이너(처음 한 번만 있으면) 정리
            docker stop ita-backend ita-nginx 2>/dev/null || true
            docker rm ita-backend ita-nginx 2>/dev/null || true

            # 최신 이미지 가져와 재배치
            docker compose pull
            docker compose up -d --remove-orphans

            # 불필요 이미지 정리
            docker image prune -f --filter dangling=true