# 추가 예시(필요에 따라 사용)
server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: PopPop

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

    #url: jdbc:mysql://poppop-db:3306/poppop
    url: jdbc:mysql://poppop-db1.cf4c0w6gqo29.ap-northeast-2.rds.amazonaws.com:3306/poppop
    username: ${MYSQLDB_USERNAME}
    password: ${MYSQLDB_PASSWORD}

  data:
    redis:
      host: poppop-cache
      port: 6379

app:
  data-init:
    enabled: true  # 기본값을 false로 설정

naver:
  geocoding:
    client-id: ${GEOCODING_ID}
    client-secret: ${GEOCODING_SECRET}

jwt:
  access-tocken-expiration: 3600000
  refresh-tocken-expiration: 1209600000
  secret: 2f8d7e9a1b3c4d5e6f7g8h9i0j1k2l3m

client:
  url: http://localhost:3000